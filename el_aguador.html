<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Patrimonio Digital - El Aguador</title>

    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
    </script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f2f0eb;
            color: #222222;
        }

        header {
            background-color: #202020;
            color: white;
            text-align: center;
            padding: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
            letter-spacing: 2px;
        }

        .contenedor {
            max-width: 850px;
            margin: 0 auto;
            padding: 16px;
        }

        .visor {
            position: relative;
            background-color: #dedbd4;
            border-radius: 12px;
            overflow: hidden;
        }

        model-viewer {
            display: block;
            width: 100%;
            height: 60vh;
            min-height: 400px;
            background-color: #dedbd4;
        }

        #botonAR {

            position: absolute;

            bottom: 20px;
            left: 50%;

            transform: translateX(-50%);

            min-width: 230px;

            background-color: #202020;
            color: white;

            border: none;
            border-radius: 8px;

            padding: 15px 22px;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        .instruccion {

            text-align: center;

            color: #777777;

            font-size: 13px;

            margin: 12px 0 25px 0;
        }

        .ficha {

            background-color: white;

            border-radius: 12px;

            padding: 28px;
        }

        .titulo {

            margin: 0;

            font-size: 32px;

            font-weight: 600;
        }

        .nota {

            border-top: 1px solid #dddddd;

            margin-top: 25px;

            padding-top: 18px;

            color: #888888;

            font-size: 12px;

            line-height: 1.5;
        }

        #error-modelo {

            display: none;

            padding: 18px;

            background-color: #ffffff;

            border-radius: 8px;

            margin-top: 15px;

            font-size: 14px;

            line-height: 1.5;
        }

        footer {

            text-align: center;

            color: #999999;

            font-size: 11px;

            padding: 30px 15px;
        }


        @media (max-width: 600px) {

            .contenedor {
                padding: 10px;
            }

            model-viewer {
                height: 55vh;
                min-height: 380px;
            }

            .ficha {
                padding: 22px;
            }

            .titulo {
                font-size: 28px;
            }

            #botonAR {
                width: 85%;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        PATRIMONIO DIGITAL
    </h1>

</header>


<main class="contenedor">


    <div class="visor">


        <model-viewer

            id="modelo"

            src="https://blenderingforconservation-maker.github.io/patrimonio-ar/models/el_aguador.glb"

            alt="Modelo tridimensional de El Aguador"

            camera-controls

            auto-rotate

            shadow-intensity="1"

            ar

            ar-modes="webxr scene-viewer quick-look"

            ar-placement="floor">


            <button
                slot="ar-button"
                id="botonAR">

                VER EN MI ESPACIO

            </button>


        </model-viewer>


    </div>


    <p class="instruccion">

        Arrastra para explorar la pieza en 3D

    </p>


    <div id="error-modelo">

        No fue posible cargar el archivo 3D.

        <br><br>

        El archivo solicitado es:

        <strong>el_aguador.glb</strong>

    </div>


    <section class="ficha">

        <h2 class="titulo">
            El Aguador
        </h2>

        <div class="nota">
            Modelo 3D generado mediante fotogrametría.
        </div>

    </section>


</main>


<footer>

    Proyecto de documentación digital del patrimonio

</footer>


<script>

    const modelo =
        document.getElementById("modelo");

    const errorModelo =
        document.getElementById("error-modelo");


    modelo.addEventListener(
        "error",
        function () {

            errorModelo.style.display = "block";

        }
    );

</script>


</body>

</html>
