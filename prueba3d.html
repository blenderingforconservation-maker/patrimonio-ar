<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Diagnóstico 3D - El Aguador</title>

    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
    </script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #eeeeee;
            color: #222222;
        }

        header {
            background-color: #202020;
            color: white;
            text-align: center;
            padding: 18px;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 16px;
        }

        .bloque {
            margin-bottom: 30px;
        }

        .bloque h2 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .visor {
            position: relative;
            background-color: #d9d9d9;
            border-radius: 12px;
            overflow: hidden;
        }

        model-viewer {
            display: block;
            width: 100%;
            height: 500px;
            background-color: #d9d9d9;
        }

        .estado {
            margin-top: 10px;
            padding: 12px;
            background-color: white;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .ar-button {
            position: absolute;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);

            min-width: 230px;

            padding: 14px 20px;

            border: none;
            border-radius: 8px;

            background-color: #202020;
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        .enlace {
            display: inline-block;
            margin-top: 10px;

            padding: 10px 14px;

            background-color: white;
            color: #222222;

            border: 1px solid #cccccc;
            border-radius: 6px;

            text-decoration: none;
            font-size: 13px;
        }

        @media (max-width: 600px) {

            main {
                padding: 10px;
            }

            model-viewer {
                height: 420px;
            }

            .ar-button {
                width: 85%;
            }
        }

    </style>

</head>


<body>


<header>

    <h1>
        DIAGNÓSTICO DE MODELO 3D
    </h1>

</header>


<main>


    <!-- ==================================== -->
    <!-- PRUEBA 1: MODELO OFICIAL DE CONTROL -->
    <!-- ==================================== -->


    <section class="bloque">

        <h2>
            PRUEBA 1: modelo oficial de control
        </h2>

        <div class="visor">

            <model-viewer

                id="modelo-control"

                src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"

                alt="Modelo oficial de prueba"

                camera-controls

                touch-action="pan-y"

                auto-rotate

                shadow-intensity="1">

            </model-viewer>

        </div>

        <div
            class="estado"
            id="estado-control">

            Cargando modelo oficial...

        </div>

    </section>



    <!-- =============================== -->
    <!-- PRUEBA 2: MODELO EL AGUADOR     -->
    <!-- =============================== -->


    <section class="bloque">

        <h2>
            PRUEBA 2: El Aguador
        </h2>

        <div class="visor">

            <model-viewer

                id="modelo-aguador"

                src="https://blenderingforconservation-maker.github.io/patrimonio-ar/models/el_aguador.glb"

                alt="Modelo tridimensional El Aguador"

                camera-controls

                touch-action="pan-y"

                auto-rotate

                shadow-intensity="1"

                ar

                ar-modes="webxr scene-viewer quick-look"

                ar-placement="floor">

                <button
                    slot="ar-button"
                    class="ar-button">

                    VER EN MI ESPACIO

                </button>

            </model-viewer>

        </div>

        <div
            class="estado"
            id="estado-aguador">

            Intentando cargar:

            <br><br>

            <strong>
                models/el_aguador.glb
            </strong>

        </div>


        <a
            class="enlace"

            href="https://blenderingforconservation-maker.github.io/patrimonio-ar/models/el_aguador.glb"

            target="_blank"

            rel="noopener noreferrer">

            ABRIR ARCHIVO GLB DIRECTAMENTE

        </a>

    </section>


</main>


<script>

    const modeloControl =
        document.getElementById("modelo-control");

    const modeloAguador =
        document.getElementById("modelo-aguador");

    const estadoControl =
        document.getElementById("estado-control");

    const estadoAguador =
        document.getElementById("estado-aguador");


    modeloControl.addEventListener(
        "load",
        () => {

            estadoControl.innerHTML =
                "✅ El visor funciona correctamente.";

        }
    );


    modeloControl.addEventListener(
        "error",
        (evento) => {

            estadoControl.innerHTML =
                "❌ Falló incluso el modelo oficial.<br><br>" +
                "El problema está en la carga de model-viewer o en el navegador.";

            console.error(
                "Error modelo oficial:",
                evento.detail
            );

        }
    );


    modeloAguador.addEventListener(
        "load",
        () => {

            estadoAguador.innerHTML =
                "✅ EL AGUADOR CARGÓ CORRECTAMENTE.<br><br>" +
                "Ya puedes probar VER EN MI ESPACIO.";

        }
    );


    modeloAguador.addEventListener(
        "error",
        (evento) => {

            estadoAguador.innerHTML =
                "❌ EL AGUADOR NO PUDO CARGARSE.<br><br>" +
                "La página funciona, pero el archivo GLB, su ruta " +
                "o su contenido presentan un problema.";

            console.error(
                "Error El Aguador:",
                evento.detail
            );

        }
    );


    modeloAguador.addEventListener(
        "ar-status",
        (evento) => {

            if (
                evento.detail.status === "failed"
            ) {

                estadoAguador.innerHTML +=
                    "<br><br>⚠️ El modelo 3D funciona, " +
                    "pero el modo AR no pudo iniciarse.";

            }

        }
    );

</script>


</body>

</html>
