<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Prueba modelo 3D</title>


    <!--
        MODEL VIEWER
        Versión fijada para evitar cambios inesperados.
    -->

    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
    </script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #eeeeee;
            color: #222222;
        }


        header {
            background: #202020;
            color: white;
            padding: 18px;
            text-align: center;
        }


        header h1 {
            margin: 0;
            font-size: 20px;
        }


        main {
            max-width: 900px;
            margin: auto;
            padding: 16px;
        }


        .visor {
            position: relative;
            background: #d9d9d9;
            border-radius: 12px;
            overflow: hidden;
        }


        model-viewer {

            width: 100%;

            height: 600px;

            max-height: 70vh;

            background-color: #d9d9d9;
        }


        #boton-ar {

            background: #202020;

            color: white;

            border: none;

            border-radius: 8px;

            padding: 14px 22px;

            font-size: 16px;

            font-weight: bold;

            position: absolute;

            left: 50%;

            bottom: 20px;

            transform: translateX(-50%);

            cursor: pointer;
        }


        #estado {

            margin-top: 15px;

            padding: 14px;

            background: white;

            border-radius: 8px;

            font-size: 14px;

            line-height: 1.5;
        }


        .ruta {

            font-family: monospace;

            overflow-wrap: anywhere;
        }


        @media (max-width: 600px) {

            main {
                padding: 10px;
            }


            model-viewer {

                height: 500px;

                max-height: 65vh;
            }


            #boton-ar {

                width: 85%;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        PRUEBA DE MODELO 3D
    </h1>

</header>


<main>


    <div class="visor">


        <model-viewer

            id="visor3d"

            src="models/el_aguador.glb"

            alt="Modelo tridimensional de prueba"

            loading="eager"

            camera-controls

            touch-action="pan-y"

            auto-rotate

            shadow-intensity="1"

            ar

            ar-modes="webxr scene-viewer quick-look"

            ar-placement="floor">


            <button
                slot="ar-button"
                id="boton-ar">

                VER EN MI ESPACIO

            </button>


        </model-viewer>


    </div>


    <div id="estado">

        Comprobando modelo...

        <br><br>

        Archivo solicitado:

        <div class="ruta">
            models/el_aguador.glb
        </div>

    </div>


</main>



<script>

    const visor =
        document.getElementById("visor3d");


    const estado =
        document.getElementById("estado");


    /*
       Si MODEL VIEWER consigue interpretar
       completamente el GLB se ejecuta "load".
    */

    visor.addEventListener(
        "load",
        () => {

            estado.innerHTML =

                "✅ MODELO CARGADO CORRECTAMENTE" +

                "<br><br>" +

                "El archivo GLB fue encontrado y " +

                "model-viewer consiguió cargarlo." +

                "<br><br>" +

                "Ahora puedes probar el botón " +

                "<strong>VER EN MI ESPACIO</strong>.";

        }
    );


    /*
       Comprueba el estado de la sesión AR.
    */

    visor.addEventListener(
        "ar-status",
        (evento) => {

            if (
                evento.detail.status === "failed"
            ) {

                estado.innerHTML +=

                    "<br><br>" +

                    "⚠️ El modelo 3D funciona, " +

                    "pero la sesión AR no pudo iniciarse.";

            }

        }
    );


    /*
       Comprobación independiente:
       ¿GitHub Pages encuentra realmente el archivo?
    */

    fetch(
        "models/el_aguador.glb",
        {
            method: "HEAD"
        }
    )

    .then(
        respuesta => {

            if (!respuesta.ok) {

                estado.innerHTML =

                    "❌ ARCHIVO NO ENCONTRADO" +

                    "<br><br>" +

                    "GitHub Pages respondió con código " +

                    respuesta.status +

                    "." +

                    "<br><br>" +

                    "Revisa el nombre y la carpeta del GLB.";

            }

        }
    )

    .catch(
        () => {

            estado.innerHTML +=

                "<br><br>" +

                "⚠️ No fue posible comprobar " +

                "automáticamente la ruta del archivo.";

        }
    );


</script>


</body>

</html>
