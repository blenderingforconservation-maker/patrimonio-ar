<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patrimonio Historico AR</title>

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
    </script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eeeeee;
        }

        h1 {
            text-align: center;
            padding: 15px;
        }

        model-viewer {
            width: 100%;
            height: 80vh;
            background-color: #dddddd;
        }

        #botonAR {
            background-color: white;
            border: none;
            border-radius: 8px;
            padding: 15px 25px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Patrimonio Historico</h1>

    <model-viewer
        src="models/leon_crop.glb"
        alt="Modelo 3D de patrimonio historico"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        ar
        ar-modes="webxr scene-viewer quick-look">

        <button slot="ar-button" id="botonAR">
            Ver en realidad aumentada
        </button>

    </model-viewer>

</body>

</html>
